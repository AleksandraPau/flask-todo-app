[tool.ruff]
# Укажите целевую версию Python, до которой нужно обновить синтаксис
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# E, W - стандартные ошибки PEP8
# F - неиспользуемые импорты и переменные
# I - сортировка импортов
# UP (pyupgrade) - автоматическое обновление старого синтаксиса Python
select = ["E", "W", "F", "I", "UP"]

# Разрешаем автоисправление для всех выбранных правил
fixable = ["ALL"]
