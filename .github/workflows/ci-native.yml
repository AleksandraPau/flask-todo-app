name: Flask App CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies and linter
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8

      - name: Run code validation (Linter)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Initialize SQLite database
        run: |
          python -c "from app import app, db; app.app_context().push(); db.create_all()" || true

      - name: Smoke test Flask server
        run: |
          nohup python app.py > flask.log 2>&1 &
          sleep 5
          cat flask.log
          curl -f http://127.0.0.1:5000 || (cat flask.log && exit 1)
